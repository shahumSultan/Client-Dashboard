services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enigma
      POSTGRES_PASSWORD: enigma_secret
      POSTGRES_DB: client_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enigma -d client_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        INSTALL_DEV: "true"   # pytest, for `docker compose exec backend pytest`
    container_name: ec_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the internal Docker service name
      DATABASE_URL: postgresql://enigma:enigma_secret@postgres:5432/client_portal
      FRONTEND_URL: http://localhost:3000
      # No object storage locally. Set STORAGE_* in .env to point at R2/S3 if
      # you need to exercise file uploads; without it they return a 503.
    volumes:
      # Local dev: run against the working tree so edits and generated
      # migrations land on the host without an image rebuild.
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # `deps` stage only installs node_modules - dev mode compiles from the
      # bind-mounted source instead of a baked production build.
      target: deps
      args:
        # Only bake truly-static public values (API URL, Clerk redirect URLs)
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
        # Required at build time: Clerk's proxy/middleware reads this name only
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    container_name: ec_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Clerk secret is runtime-only. The publishable key is also set here so
      # server components can read it; it is baked in at build time as well
      # because Next inlines NEXT_PUBLIC_* variables.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Anonymous volume keeps the image's node_modules (built for alpine/musl)
      # from being shadowed by the host's.
      - /app/node_modules
      - /app/.next
    command: sh -c "npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
