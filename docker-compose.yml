services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ec_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: enigma
      POSTGRES_PASSWORD: enigma_secret
      POSTGRES_DB: client_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enigma -d client_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── MinIO (local S3-compatible object storage) ──────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: ec_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console  →  http://localhost:9001
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the default bucket once MinIO is healthy
  minio-init:
    image: minio/mc:latest
    container_name: ec_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/client-portal &&
        mc anonymous set public local/client-portal &&
        echo 'Bucket ready.'
      "
    restart: "no"

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ec_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the internal Docker service name
      DATABASE_URL: postgresql://enigma:enigma_secret@postgres:5432/client_portal
      FRONTEND_URL: http://localhost:3000
      # MinIO storage (internal backend → minio)
      STORAGE_BUCKET: client-portal
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_EXTERNAL_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin123
      STORAGE_PUBLIC_URL: http://localhost:9000/client-portal
    ports:
      - "8000:8000"

  # ── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Only bake truly-static public values (API URL, Clerk redirect URLs)
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /dashboard
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /dashboard
    container_name: ec_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # Clerk keys injected at runtime — no rebuild needed when key changes
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
